      APP_KEYSTORE_ALIAS: "jwtkey"
      APP_KEYSTORE_KEY_PASSWORD: "Genius@Keypass1"

      APP_STORAGE_DIR: "/app/keystore/storage"

      SUPABASE_URL: "https://aqzawbrlhzumygbzeoyo.supabase.co"
      SUPABASE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxemF3YnJsaHp1bXlnYnplb3lvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4NjUyOTIsImV4cCI6MjA4MDQ0MTI5Mn0.53nqHoxLfus9Pk88OiRTAV7w5nO096evqMFEExAg0R8"
      SUPABASE_BUCKET: "documents"
