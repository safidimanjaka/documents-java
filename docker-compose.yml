    environment:
      SPRING_DATASOURCE_URL: "jdbc:postgresql://database:5432/confdocdb?sslmode=disable"
      SPRING_DATASOURCE_USERNAME: "postgres"
      SPRING_DATASOURCE_PASSWORD: "postgres"

