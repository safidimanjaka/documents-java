version: "3.9"

services:
  database:
    image: postgres:15
    container_name: confdb
    restart: always
    environment:
      POSTGRES_DB: confdocdb
      POSTGRES_USER: confdocdb_user
      POSTGRES_PASSWORD: 51uJfYX71djjo8DJHpDDJjkTloY9lcId
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - confnet

  webservice:
